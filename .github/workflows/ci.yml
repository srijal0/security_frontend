name: CI - Frontend Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (dependency vulnerability scan)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run lint
        run: npm run lint
        continue-on-error: true

      - name: Build project
        run: npm run build