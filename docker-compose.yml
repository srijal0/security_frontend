# docker-compose.yml
version: "3.9"

services:
  backend:
    build:
      context: ./banksecure-backend
      dockerfile: Dockerfile
    container_name: banksecure-backend
    ports:
      - "5001:5001"
    env_file:
      - ./banksecure-backend/.env
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./banksecure-frontend
      dockerfile: Dockerfile
    container_name: banksecure-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5001/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_uploads: